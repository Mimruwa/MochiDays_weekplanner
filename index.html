<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes"><meta name="theme-color" content="#fae1ea"><meta name="description" content="Mochi Days — a cozy kawaii planner for daily plans, doodles, and happy little habits"><link rel="manifest" href="manifest.webmanifest"><title>Mochi Days · Kawaii Planner</title>
<style>
:root{--ink:#422c30;--muted:#8d7178;--cream:#fffdf5;--pink:#ffe3ec;--pink2:#f8cadb;--blue:#dff2ff;--mint:#e2f6e2;--yellow:#fff2c9;--lav:#eee6ff;--edge:#e8cad0;--shadow:0 12px 40px #af829128}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 12% 12%,#ffe8ef,transparent 28%),radial-gradient(circle at 90% 80%,#eaf5e2,transparent 37%),#fdf7f1;font-family:'Trebuchet MS',Verdana,sans-serif;color:var(--ink)}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #be93cb;outline-offset:2px}.app{max-width:1300px;margin:22px auto;padding:0 14px}.topbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:10px 10px 17px}.brand{display:flex;align-items:center;gap:10px}.brand b{font-size:23px;letter-spacing:-1px}.brand small{display:block;color:var(--muted);font-size:12px;margin-top:3px}.mascot{position:relative;width:47px;height:42px;border:2.5px solid var(--ink);border-radius:48% 48% 43% 43%;background:white;box-shadow:inset 0 -3px 0 #fff1f4;flex-shrink:0}.mascot:before{content:'';position:absolute;left:12px;top:17px;width:4px;height:4px;background:#392a2f;border-radius:50%;box-shadow:15px 0 #392a2f}.mascot:after{content:'ᴗ';position:absolute;left:20px;top:16px;font-size:13px}.sprout{position:absolute;top:-12px;left:23px;transform:rotate(-25deg);font-size:21px}.cheek{position:absolute;left:5px;top:22px;width:8px;height:5px;border-radius:50%;background:#ffbbcf;box-shadow:27px 0 #ffbbcf}.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.pill{border:1.5px solid #d8b7c1;background:#fff;box-shadow:0 2px 0 #e9cdd4;border-radius:18px;padding:9px 13px;font-weight:700;font-size:13px;transition:.14s}.pill:hover{transform:translateY(-1px)}.pill.active{background:#fbcddd}.pill.primary{background:#ffcfe0;border-color:#e2a8be}.workspace{background:var(--cream);border:2px solid #e2c7c0;border-radius:22px 22px 16px 22px;box-shadow:var(--shadow);min-height:600px;position:relative;padding:28px 70px 30px 48px;overflow:hidden}.workspace:before{content:'';position:absolute;left:11px;top:15px;bottom:15px;width:17px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 18px,#b18d66 18px,#b18d66 24px,transparent 24px,transparent 47px);border-radius:10px;opacity:.8}.tabs{position:absolute;right:0;top:12px;display:flex;flex-direction:column;gap:4px}.tab{width:54px;height:36px;border:1px solid #d5b7b4;border-right:0;border-radius:10px 0 0 10px;font-size:11px;font-weight:800;background:#e6f3fc}.tab:nth-child(3n+2){background:#ffeecb}.tab:nth-child(3n){background:#efdcf9}.tab.active{width:58px;transform:translateX(-3px);box-shadow:-3px 0 0 #d59dad}.mainhead{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;border-bottom:2px dashed #f2d5df;padding-bottom:13px}.mainhead h1{font-size:clamp(28px,4vw,44px);margin:0 0 4px;letter-spacing:-1.4px}.mainhead p{margin:0;color:#9d7b82;font-size:13px}.datebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.datebar input{padding:8px;border:1.5px solid #e8c0cd;background:#fff5f8;border-radius:10px;max-width:160px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{border:1.8px solid var(--edge);border-radius:17px;padding:15px;background:#fff}.panel.blue{background:var(--blue);border-color:#c6e4f6}.panel.pink{background:var(--pink);border-color:#f1c8d7}.panel.yellow{background:var(--yellow);border-color:#f0dca4}.panel.mint{background:var(--mint);border-color:#c6e5c8}.panel.lav{background:var(--lav);border-color:#d9c5f0}.panel h2{font-size:17px;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between}.panel h2 span{font-size:17px}.task{display:flex;align-items:center;gap:9px;margin:6px 0}.task input[type=checkbox]{accent-color:#d98ea6;width:17px;height:17px;flex-shrink:0}.task input[type=text]{border:0;border-bottom:1px solid #da aycard h2{font-size:15px}.daycard .open{margin-top:auto;align-self:flex-end}.field{width:100%;border:1px solid #e7c8ca;border-radius:9px;padding:9px;background:#fffdfc}.bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:14px}.bar h2{margin:0}.bar .pill{padding:7px 10px}.footer{text-align:center;color:#9f8892;font-size:12px;padding:15px 5px}.callout{background:#fff0f4;border:1px solid #f1cbd6;border-radius:12px;padding:12px;margin-top:12px;font-size:13px}.hidden{display:none!important}.hint{font-size:12px;color:#896f7a}.habit-row{display:grid;grid-template-columns:1.7fr repeat(7,minmax(0,1fr));gap:4px;align-items:center;margin-bottom:6px}.habit-row input{width:100%;min-width:0;padding:6px;border:1px solid #e8d0cc;border-radius:7px}.habit-day{text-align:center;padding:7px 0;border-radius:6px;background:#fff0d7;font-size:11px;font-weight:700}.habit-row input[type=checkbox]{width:17px;height:17px;justify-self:center;accent-color:#d889a6}.status{font-size:12px;color:#7b947c}.wide{grid-column:1/-1}@media(max-width:850px){.app{margin:6px auto;padding:0 6px}.workspace{padding:20px 56px 22px 27px;min-height:70vh}.topbar{padding:10px 3px}.weekgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.datecell{min-height:65px}.tabs{top:9px}.tab{height:31px;width:44px;font-size:10px}.mainhead{align-items:flex-start;flex-direction:column}}@media(max-width:560px){.grid,.weekgrid{grid-template-columns:1fr}.workspace{padding:18px 47px 18px 24px}.tab{height:28px;width:35px;font-size:9px}.tabs{gap:2px}.mainhead h1{font-size:28px}.monthgrid{gap:2px}.datecell{min-height:48px;padding:4px 2px}.datecell .marks{display:none}.dow{font-size:9px}.datebar input{max-width:140px}.brand b{font-size:19px}.pill{font-size:11px;padding:8px 9px}}
</style><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"><link href="theme.css" rel="stylesheet"></head><body>
<div class="app"><header class="topbar"><div class="brand"><img class="brand-mochi" src="assets/mochi-flower.svg" alt="Smiling little Mochi mascot"><div><b>Mochi Days ♡</b><small>little plans, lovely days ✿</small></div></div><div class="tools"><button class="pill" data-view="daily">☀ My Day</button><button class="pill" data-view="weekly">♡ My Week</button><button class="pill" data-view="monthly">▦ My Month</button><button class="pill" data-view="habits">✿ Little Habits</button><button class="pill" data-view="settings">🎀 My Keepsakes</button><button class="pill primary" id="cloudButton" type="button">☁ My Account</button></div></header>
<main class="workspace"><aside class="tabs" id="monthTabs"></aside><div id="screen"></div></main><footer class="footer">✿ Made for little happy days · Keep your memories safe with a backup ♡</footer></div>
<script>
(()=>{'use strict';
let K='mochi_days_demo_v1';let db;try{db=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){db={}}if(!db.days)db.days={};if(!db.weeks)db.weeks={};if(!db.months)db.months={};if(!db.habits)db.habits={};if(!db.drawings)db.drawings={};
let selected=new Date();selected.setHours(12,0,0,0);let view='daily',tool='pen',color='#b977ab',strokeWidth=3;const scr=document.getElementById('screen'),mt=document.getElementById('monthTabs');
const pad=n=>String(n).padStart(2,'0'),dateKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,parseDate=s=>{let a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2],12)},monthKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}`,wstart=d=>{let r=new Date(d);r.setDate(r.getDate()-((r.getDay()+6)%7));return r},addDays=(d,n)=>{let a=new Date(d);a.setDate(a.getDate()+n);return a},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];const save=()=>{try{localStorage.setItem(K,JSON.stringify(db));let s=document.getElementById('saved');if(s)s.textContent='♡ Saved on this device';if(window.mochiOnLocalSave)window.mochiOnLocalSave()}catch(e){alert('Storage is full. Export a backup and free space.')}};
const dayObj=()=>db.days[dateKey(selected)]??(db.days[dateKey(selected)]={tasks:Array.from({length:6},()=>({done:false,text:''})),priority:Array.from({length:3},()=>({done:false,text:''})),schedule:{},notes:'',gratitude:'',mood:-1,water:0});
const head=(title,sub)=>`<div class="mainhead"><div><h1>${title} <span style="font-size:24px">🌷</span></h1><p>${sub}</p></div><div class="datebar"><button class="pill" id="prev">◀</button><input type="date" id="datePick" value="${dateKey(selected)}" aria-label="Selected date"><button class="pill" id="next">▶</button></div></div>`;
const fieldTask=(scope,i,t)=>`<div class="task"><input type="checkbox" aria-label="Complete ${scope} ${i+1}" data-scope="${scope}" data-i="${i}" data-kind="check" ${t.done?'checked':''}><input type="text" aria-label="${scope} ${i+1}" placeholder="${scope==='priority'?'Something important':'Add a task…'}" data-scope="${scope}" data-i="${i}" data-kind="text" value="${esc(t.text)}"></div>`;
function tabs(){mt.innerHTML=`<button class="tab" data-tab="home" title="Go to Today">⌂</button>`+months.map((m,i)=>`<button class="tab ${selected.getMonth()===i?'active':''}" data-month="${i}" title="${m}">${m.toUpperCase()}</button>`).join('');mt.querySelectorAll('[data-month]').forEach(b=>b.addEventListener('click',()=>{selected.setMonth(+b.dataset.month,Math.min(selected.getDate(),28));view='monthly';render()}));mt.querySelector('[data-tab]').onclick=()=>{selected=new Date();selected.setHours(12,0,0,0);view='daily';render()}};
function nav(){document.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);b.onclick=()=>{view=b.dataset.view;render()}})}
function navdates(unit){let step=unit==='month'?1:unit==='week'?7:1;document.getElementById('prev').onclick=()=>{if(unit==='month')selected.setMonth(selected.getMonth()-1,Math.min(selected.getDate(),28));else selected=addDays(selected,-step);render()};document.getElementById('next').onclick=()=>{if(unit==='month')selected.setMonth(selected.getMonth()+1,Math.min(selected.getDate(),28));else selected=addDays(selected,step);render()};document.getElementById('datePick').onchange=e=>{if(/^\d{4}-\d{2}-\d{2}$/.test(e.target.value)){selected=parseDate(e.target.value);render()}}}
function renderDaily(){let d=dayObj(),dk=dateKey(selected);scr.innerHTML=head('My Daily Planner',selected.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'}))+`<div class="grid"><div><section class="panel blue"><h2>♡ My Top 3 <span>✦</span></h2>${d.priority.map((t,i)=>fieldTask('priority',i,t)).join('')}</section><section class="panel mint" style="margin-top:14px"><h2>◷ Schedule</h2><div class="schedule">${Array.from({length:14},(_,i)=>{let hr=i+8;let txt=hr>12?`${hr-12} PM`:hr===12?'12 PM':`${hr} AM`;return `<label>${txt}</label><input data-hour="${hr}" value="${esc(d.schedule[hr]||'')}" placeholder="…">`}).join('')}</div></section></div><div><section class="panel yellow"><h2>☆ Little To-Dos <span>♡</span></h2>${d.tasks.map((t,i)=>fieldTask('tasks',i,t)).join('')}</section><section class="panel pink" style="margin-top:14px"><h2>✎ Notes</h2><textarea class="lined" id="notes" placeholder="Write your thoughts here…">${esc(d.notes)}</textarea></section><section class="panel lav" style="margin-top:14px"><h2>♡ Gratitude</h2><textarea class="lined" id="gratitude" style="min-height:70px" placeholder="A little thing that made you smile…">${esc(d.gratitude)}</textarea></section><div class="grid" style="margin-top:14px"><section class="panel pink"><h2>☻ Mood</h2><div class="streak" id="moods">${['😄','🙂','😐','😟','😴'].map((m,i)=>`<button class="mini ${d.mood===i?'chosen':''}" data-mood="${i}" title="Mood ${i+1}">${m}</button>`).join('')}</div></section><section class="panel blue"><h2>♧ Water</h2><div class="streak" id="waters">${Array.from({length:8},(_,i)=>`<button class="mini ${i<d.water?'chosen':''}" data-water="${i+1}" aria-label="${i+1} glasses">💧</button>`).join('')}</div></section></div></div><div class="wide panel" style="margin-top:0;background:#fff6fb"><div class="bar"><h2>✏ My Doodle Corner</h2><span class="hint">Use your finger, stylus or mouse</span></div><div class="drawbox"><div class="drawtools"><button class="pill active" id="pen">✎ Pen</button><button class="pill" id="eraser">⌫ Eraser</button><button class="pill" id="clear">Clear drawing</button><label style="font-size:12px">Color <input type="color" id="ink" value="${color}"></label><label style="font-size:12px">Size <input type="range" id="width" min="2" max="14" value="${strokeWidth}"></label><span class="status" id="saved">♡ Saved on this device</span></div><div class="drawarea"><canvas id="drawing" aria-label="Finger or stylus drawing area"></canvas></div></div></div></div>`;
navdates('day');document.querySelectorAll('[data-scope]').forEach(e=>{e.addEventListener('input',()=>{let r=dayObj()[e.dataset.scope][+e.dataset.i];if(e.dataset.kind==='text')r.text=e.value;save()});e.addEventListener('change',()=>{let r=dayObj()[e.dataset.scope][+e.dataset.i];if(e.dataset.kind==='check')r.done=e.checked;save()})});document.querySelectorAll('[data-hour]').forEach(e=>e.oninput=()=>{dayObj().schedule[e.dataset.hour]=e.value;save()});['notes','gratitude'].forEach(k=>document.getElementById(k).oninput=e=>{dayObj()[k]=e.target.value;save()});document.querySelectorAll('[data-mood]').forEach(e=>e.onclick=()=>{dayObj().mood=+e.dataset.mood;save();document.querySelectorAll('[data-mood]').forEach(b=>b.classList.toggle('chosen',b===e))});document.querySelectorAll('[data-water]').forEach(e=>e.onclick=()=>{dayObj().water=+e.dataset.water;save();document.querySelectorAll('[data-water]').forEach(b=>b.classList.toggle('chosen',+b.dataset.water<=dayObj().water))});setupCanvas(dk)}
function renderWeekly(){let st=wstart(selected),wk=dateKey(st),rec=db.weeks[wk]??(db.weeks[wk]={goal:'',reflection:''});scr.innerHTML=head('My Weekly Planner',`Week of ${st.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}`)+`<div class="weekgrid">${days.map((day,i)=>{let date=addDays(st,i),r=db.days[dateKey(date)],done=r?.tasks?.filter(t=>t.done).length||0,total=r?.tasks?.filter(t=>t.text).length||0;let colors=['pink','yellow','lav','mint','blue','pink','yellow'];return `<section class="panel ${colors[i]} daycard"><h2>${day.toUpperCase()} <span>${date.getDate()}</span></h2><p class="hint">${date.toLocaleDateString('en-US',{month:'short'})} · ${done}/${total} tasks done</p><div style="flex:1">${(r?.tasks||[]).filter(t=>t.text).slice(0,4).map(t=>`<p style="font-size:12px;margin:8px 0">${t.done?'☑':'☐'} ${esc(t.text)}</p>`).join('')||'<p class="hint">A fresh new day ♡</p>'}</div><button class="pill open" data-open="${dateKey(date)}">Open day ↗</button></section>`}).join('')}</div><div class="grid" style="margin-top:15px"><section class="panel mint"><h2>☆ Weekly Goals</h2><textarea class="lined" data-week="goal" placeholder="What would make this week lovely?">${esc(rec.goal)}</textarea></section><section class="panel lav"><h2>♡ Weekly Reflection</h2><textarea class="lined" data-week="reflection" placeholder="Little wins, favorite moments…">${esc(rec.reflection)}</textarea></section></div>`;navdates('week');document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{selected=parseDate(b.dataset.open);view='daily';render()});document.querySelectorAll('[data-week]').forEach(e=>e.oninput=()=>{rec[e.dataset.week]=e.value;save()})}
function renderMonthly(){const yr=selected.getFullYear(),mi=selected.getMonth(),first=new Date(yr,mi,1,12),offset=(first.getDay()+6)%7,n=new Date(yr,mi+1,0).getDate(),mk=monthKey(selected),rec=db.months[mk]??(db.months[mk]={goals:'',dates:'',notes:''});scr.innerHTML=head('My Monthly Planner',`${months[mi]} ${yr} · tap any date to plan your day`)+`<div class="monthgrid">${days.map(d=>`<div class="dow">${d}</div>`).join('')}${Array.from({length:42},(_,i)=>{let d=i-offset+1;if(d<1||d>n)return '<div class="datecell empty"></div>';let dt=new Date(yr,mi,d,12),ob=db.days[dateKey(dt)],count=ob?.tasks?.filter(t=>t.text).length||0;return `<button class="datecell" data-open="${dateKey(dt)}"><span class="num">${d}</span><span class="marks">${count?`${count} task${count>1?'s':''}`:'♡'}</span></button>`}).join('')}</div><div class="grid" style="margin-top:15px"><section class="panel pink"><h2>♡ Goals This Month</h2><textarea class="lined" data-mfield="goals" placeholder="Monthly intentions…">${esc(rec.goals)}</textarea></section><section class="panel mint"><h2>✿ Important Dates</h2><textarea class="lined" data-mfield="dates" placeholder="Birthdays, deadlines, reminders…">${esc(rec.dates)}</textarea></section><section class="panel lav wide"><h2>✎ Notes</h2><textarea class="lined" data-mfield="notes" placeholder="Things to remember…">${esc(rec.notes)}</textarea></section></div>`;navdates('month');scr.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{selected=parseDate(b.dataset.open);view='daily';render()});scr.querySelectorAll('[data-mfield]').forEach(e=>e.oninput=()=>{rec[e.dataset.mfield]=e.value;save()})}
function renderHabits(){let mk=monthKey(selected),rec=db.habits[mk]??(db.habits[mk]={names:['Drink water','Move my body','Read','Self-care','Sleep on time','Journal','Practice','Stretch'],checks:{}});const dateCount=new Date(selected.getFullYear(),selected.getMonth()+1,0).getDate();scr.innerHTML=head('My Habit Garden',`${months[selected.getMonth()]} ${selected.getFullYear()} · tap to track`)+`<section class="panel mint"><h2>✿ My little habits</h2><p class="hint">Tap the circles to mark a habit complete. This compact view shows days 1–7 and 8–14; use the week selector to see the rest.</p><div class="bar"><label>Days <select class="field" style="width:140px" id="habitBlock">${[0,1,2,3,4].map(i=>`<option value="${i}">${i*7+1}–${Math.min((i+1)*7,dateCount)}</option>`).join('')}</select></label></div><div id="habitBody"></div></section>`;navdates('month');const renderChecks=()=>{let s=+document.getElementById('habitBlock').value,nums=Array.from({length:7},(_,i)=>s*7+i+1);document.getElementById('habitBody').innerHTML=`<div class="habit-row"><b style="font-size:13px">Habit</b>${nums.map(d=>`<div class="habit-day">${d<=dateCount?d:''}</div>`).join('')}</div>`+rec.names.map((name,i)=>`<div class="habit-row"><input data-hname="${i}" value="${esc(name)}" aria-label="Habit ${i+1}">${nums.map(d=>d<=dateCount?`<input type="checkbox" data-check="${i}-${d}" ${rec.checks[i+'-'+d]?'checked':''}>`:'<span></span>').join('')}</div>`).join('');document.querySelectorAll('[data-hname]').forEach(e=>e.oninput=()=>{rec.names[+e.dataset.hname]=e.value;save()});document.querySelectorAll('[data-check]').forEach(e=>e.onchange=()=>{rec.checks[e.dataset.check]=e.checked;save()})};document.getElementById('habitBlock').onchange=renderChecks;renderChecks()}
function renderSettings(){scr.innerHTML=`<div class="backup-hero"><div><h1>My Little Keepsakes ♡</h1><p>Keep all your happy little plans safe and sound!</p></div><img src="assets/mochi-heart.svg" alt="Mochi cuddling a pink heart"></div><div class="grid backup-grid"><section class="panel mint backup-panel"><h2>💌 Save My Planner</h2><p>A cozy little backup of your notes, checklists, habits and doodles—ready whenever you need it.</p><button class="pill primary" id="export">↓ Download My Backup ♡</button><img class="backup-illustration" src="assets/mochi-pencil.svg" alt="Mochi with a pencil"></section><section class="panel blue backup-panel"><h2>🎀 Bring My Planner Back</h2><p>Have a saved backup? Choose it here to bring your lovely plans back.</p><label class="settings-detail" for="import">Choose a Mochi Days backup (.json)</label><input type="file" accept=".json,application/json" id="import" class="field"><img class="backup-illustration" src="assets/mochi-flower.svg" alt="Mochi with flowers"></section><section class="backup-tip"><div class="tipcopy"><h2>🌸 A little note for you ♡</h2><p>Your plans are saved in this browser. Want an extra copy? Tap <strong>Download My Backup</strong> to keep your notes, habits, and drawings somewhere safe.</p><p class="settings-detail">Restoring a backup replaces the plans currently saved here. Cloud sync is available after account setup.</p></div><img src="assets/mochi-heart.svg" alt="Mochi hugging a heart"></section></div>`;document.getElementById('export').onclick=()=>{save();const blob=new Blob([JSON.stringify({format:'MochiDaysV1',data:db,exported:new Date().toISOString()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`Mochi_Days_backup_${dateKey(new Date())}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};document.getElementById('import').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(x.format!=='MochiDaysV1'||!x.data?.days)throw Error('Invalid backup file');if(confirm('Replace the planner notes saved here with this backup?')){db=x.data;save();view='daily';render()}}catch(err){alert('Could not import: '+err.message)}}}
function setupCanvas(k){const c=document.getElementById('drawing');if(!c)return;const box=c.parentElement;const ctx=c.getContext('2d');let painting=false,old=null;let img=db.drawings[k]||null;function fit(){const scale=window.devicePixelRatio||1;const w=box.clientWidth,h=box.clientHeight;c.width=Math.max(1,Math.round(w*scale));c.height=Math.max(1,Math.round(h*scale));ctx.scale(scale,scale);if(img){let I=new Image;I.onload=()=>ctx.drawImage(I,0,0,w,h);I.src=img}}fit();c.onpointerdown=e=>{e.preventDefault();c.setPointerCapture(e.pointerId);painting=true;const r=c.getBoundingClientRect();old={x:e.clientX-r.left,y:e.clientY-r.top};ctx.beginPath();ctx.moveTo(old.x,old.y);ctx.lineTo(old.x+.1,old.y+.1);ctx.lineWidth=strokeWidth;ctx.lineCap='round';ctx.strokeStyle=color;ctx.globalCompositeOperation=tool==='eraser'?'destination-out':'source-over';ctx.stroke()};c.onpointermove=e=>{if(!painting)return;e.preventDefault();const r=c.getBoundingClientRect(),p={x:e.clientX-r.left,y:e.clientY-r.top};ctx.beginPath();ctx.moveTo(old.x,old.y);ctx.lineTo(p.x,p.y);ctx.lineWidth=strokeWidth;ctx.lineCap='round';ctx.strokeStyle=color;ctx.globalCompositeOperation=tool==='eraser'?'destination-out':'source-over';ctx.stroke();old=p};const finish=()=>{if(!painting)return;painting=false;ctx.globalCompositeOperation='source-over';img=c.toDataURL('image/png');db.drawings[k]=img;save()};c.onpointerup=finish;c.onpointercancel=finish;document.getElementById('pen').onclick=()=>{tool='pen';document.getElementById('pen').classList.add('active');document.getElementById('eraser').classList.remove('active')};document.getElementById('eraser').onclick=()=>{tool='eraser';document.getElementById('eraser').classList.add('active');document.getElementById('pen').classList.remove('active')};document.getElementById('ink').oninput=e=>color=e.target.value;document.getElementById('width').oninput=e=>strokeWidth=+e.target.value;document.getElementById('clear').onclick=()=>{if(confirm('Clear drawing for this day?')){ctx.clearRect(0,0,c.width,c.height);delete db.drawings[k];img=null;save()}}}
function render(){tabs();nav();if(view==='daily')renderDaily();else if(view==='weekly')renderWeekly();else if(view==='monthly')renderMonthly();else if(view==='habits')renderHabits();else renderSettings()}
window.mochiBridge={getData:()=>JSON.parse(JSON.stringify(db)),getUserStorageKey:()=>K,loadAccount:(userId)=>{K=userId?'mochi_days_user_'+userId:'mochi_days_demo_v1';try{db=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){db={}}for(const part of ['days','weeks','months','habits','drawings'])if(!db[part])db[part]={};render();},applyRemote:(data)=>{db=data;for(const part of ['days','weeks','months','habits','drawings'])if(!db[part])db[part]={};try{localStorage.setItem(K,JSON.stringify(db))}catch(e){alert('Storage is full; download backup')}render();}};
render();if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
